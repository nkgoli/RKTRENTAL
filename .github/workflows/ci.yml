name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://rocketrental:rocketrental@localhost:5432/rocketrental?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rocketrental
          POSTGRES_PASSWORD: rocketrental
          POSTGRES_DB: rocketrental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rocketrental"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: RUN_DB_INTEGRATION=1 npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rocketrental:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
